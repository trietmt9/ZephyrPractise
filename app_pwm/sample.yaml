sample:
  name: PWM Signal Generation
  description: PWM example demonstrating signal generation and duty cycle control
tests:
  sample.app.pwm:
    tags:
      - pwm
      - LED
    filter: dt_enabled_alias_with_parent_compat("pwm-led0", "pwm-leds")
    depends_on: pwm
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "PWM"
