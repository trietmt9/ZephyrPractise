sample:
  name: SPI Device Driver Example
  description: Demonstrates SPI communication with custom driver abstraction, including write, read, and full-duplex transfer operations
tests:
  sample.app.spi:
    tags:
      - spi
      - driver
      - communication
    filter: dt_nodelabel_enabled("spi1")
    depends_on: spi
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "SPI initialized successfully"
        - "Transfer test passed"
