sample:
  name: External Interrupt Example
  description: External interrupt (EXTI) handling with GPIO callbacks
tests:
  sample.app.exti:
    tags:
      - gpio
      - interrupt
      - button
    filter: dt_enabled_alias_with_parent_compat("mybtn", "gpio-keys")
    depends_on: gpio
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "Button|Interrupt"
