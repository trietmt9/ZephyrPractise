sample:
  name: Hello World with Logging
  description: Basic Hello World application demonstrating printk and logging subsystem
tests:
  sample.app.helloworld:
    tags:
      - logging
      - console
    harness: console
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "Hello World sent using printk"
        - "Helloworld sent using Log INFO level"
